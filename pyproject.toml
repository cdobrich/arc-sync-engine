[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "archive-sync-engine"
dynamic = ["version"]
description = "Platform-independent archive and synchronization engine for messaging platforms"
requires-python = ">=3.11"
dependencies = [
    "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
discord = [
    "discord.py>=2.7,<3",
]
fluxer = [
    "fluxer.py>=0.4.2,<0.5",
]
sync = [
    "discord.py>=2.7,<3",
    "fluxer.py>=0.4.2,<0.5",
]

[project.scripts]
archive-sync-engine = "archive_sync_engine.cli:main"

[tool.setuptools.dynamic]
version = {attr = "archive_sync_engine.__about__.__version__"}

[tool.setuptools.packages.find]
include = ["archive_sync_engine*"]

[tool.setuptools.data-files]
"share/archive-sync-engine" = ["config-example.yaml"]
